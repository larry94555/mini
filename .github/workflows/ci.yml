name: CI

# Build + test on every push to main and on every pull request.
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    name: Build & unit tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node.js (so the stdio MCP integration tests run instead of self-skipping)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Cache wrapper Maven distribution
        uses: actions/cache@v4
        with:
          path: .maven
          key: ${{ runner.os }}-mvnwrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw
      - name: Check docs reference integrity (test/class/file/case references resolve)
        run: bash scripts/check-docs.sh
      - name: Self-test the docs checker's anchor/slug logic
        run: bash scripts/check-docs-selftest.sh
      - name: Run the test suite
        run: ./mvnw -B -ntp test

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the imini image (validates the Dockerfile + packaging)
        run: docker build -t imini:ci .
