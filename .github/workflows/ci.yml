name: CI

# Build + test on every push to main and on every pull request.
on:
  push:
    branches: [ "main" ]
  pull_request:

jobs:
  build-test:
    name: Build & unit tests (JDK 21)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run the test suite
        run: ./mvnw -B -ntp test

  docker-build:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the imini image (validates the Dockerfile + packaging)
        run: docker build -t imini:ci .
