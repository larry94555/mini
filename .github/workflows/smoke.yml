name: Smoke (cross-platform)

# Proves the project builds and boots on Linux and macOS, the POSIX scripts parse, and the Maven wrapper
# works -- catching platform regressions the Windows-only path would miss. Unit tests run in ci.yml.
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Build + boot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Make wrapper + scripts executable
        run: chmod +x mvnw *.sh scripts/*.sh

      - name: POSIX scripts parse cleanly (sh -n)
        run: |
          for f in *.sh scripts/*.sh; do sh -n "$f"; done
          echo "all scripts ok"

      - name: Maven wrapper runs
        run: ./mvnw -B -ntp -version

      - name: Build (skip tests; tests run in ci.yml)
        run: ./mvnw -B -ntp -DskipTests package

      - name: Boot headless and probe /health
        shell: bash
        run: |
          JAR="$(ls target/*.jar | grep -v -E 'sources|javadoc' | head -n1)"
          echo "running $JAR"
          java -jar "$JAR" --llama.manage-server=false --server.port=8080 > app.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          kill "$APP_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "::error::app did not become healthy"; tail -n 80 app.log; exit 1; fi
          echo "health OK on ${{ matrix.os }}"
