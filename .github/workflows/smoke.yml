name: Smoke (cross-platform)

# Proves the project builds and boots on Linux, macOS, AND Windows, the POSIX scripts parse, the Maven
# wrapper works on each OS, and the script hygiene (executable bit + LF) holds. Unit tests run in ci.yml.
on:
  push:
    branches: [ "main" ]
  pull_request:
  workflow_dispatch:

jobs:
  smoke:
    name: Build + boot (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Cache wrapper Maven distribution
        uses: actions/cache@v4
        with:
          path: .maven
          key: ${{ runner.os }}-mvnwrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}

      # ---------- Script hygiene guard (Linux only; advisory so it never wedges the build) ----------
      - name: Guard - scripts executable + LF (hard fail)
        if: runner.os == 'Linux'
        run: bash .githooks/check-scripts.sh

      # ---------- POSIX path (Linux / macOS) ----------
      - name: Make wrapper + scripts executable
        if: runner.os != 'Windows'
        run: chmod +x mvnw *.sh scripts/*.sh

      - name: POSIX scripts parse cleanly (sh -n)
        if: runner.os != 'Windows'
        run: |
          for f in *.sh scripts/*.sh; do sh -n "$f"; done
          echo "all scripts ok"

      - name: Maven wrapper runs (POSIX)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp -version

      - name: Build (POSIX; skip tests -- tests run in ci.yml)
        if: runner.os != 'Windows'
        run: ./mvnw -B -ntp -DskipTests package

      - name: Boot headless and probe /health (POSIX)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          JAR="$(ls target/*.jar | grep -v -E 'sources|javadoc' | head -n1)"
          echo "running $JAR"
          java -jar "$JAR" --llama.manage-server=false --server.port=8080 > app.log 2>&1 &
          APP_PID=$!
          ok=0
          for i in $(seq 1 60); do
            if curl -fs http://localhost:8080/health >/dev/null 2>&1; then ok=1; break; fi
            sleep 2
          done
          kill "$APP_PID" 2>/dev/null || true
          if [ "$ok" != "1" ]; then echo "::error::app did not become healthy"; tail -n 80 app.log; exit 1; fi
          echo "health OK on ${{ matrix.os }}"

      # ---------- Windows path (exercises mvnw.cmd + get-maven.ps1) ----------
      - name: Maven wrapper runs (Windows)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp -version

      - name: Build (Windows; skip tests)
        if: runner.os == 'Windows'
        run: .\mvnw.cmd -B -ntp -DskipTests package

      - name: Boot headless and probe /health (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $jar = Get-ChildItem target\*.jar | Where-Object { $_.Name -notmatch 'sources|javadoc' } | Select-Object -First 1
          Write-Host "running $($jar.FullName)"
          $p = Start-Process -FilePath java -ArgumentList @('-jar', $jar.FullName, '--llama.manage-server=false', '--server.port=8080') -PassThru -RedirectStandardOutput app.log -RedirectStandardError apperr.log
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            try { Invoke-WebRequest -UseBasicParsing http://localhost:8080/health -TimeoutSec 3 | Out-Null; $ok = $true; break }
            catch { Start-Sleep -Seconds 2 }
          }
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          if (-not $ok) { Write-Host "::error::app did not become healthy"; if (Test-Path app.log) { Get-Content app.log -Tail 80 }; exit 1 }
          Write-Host "health OK on windows"
