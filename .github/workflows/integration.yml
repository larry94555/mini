name: Integration tests

# OPT-IN integration gate. Unlike ci.yml (which runs the whole suite on every push/PR, where driver-gated
# tests self-skip if a prerequisite is missing), this job exists to make the real-dependency paths explicit
# and easy to run on demand: the real-SQLite durable-grants integration test plus the persistence
# round-trips and the golden/eval traces. sqlite-jdbc and Node are provisioned so those tests actually run
# instead of self-skipping. Trigger manually (workflow_dispatch) or by adding the "run-integration" label
# to a PR.
on:
  workflow_dispatch:
  pull_request:
    types: [ labeled ]

permissions:
  contents: read

jobs:
  integration:
    name: Real-dependency integration tests (JDK 21)
    # On PRs, only run when the "run-integration" label is present; always run on manual dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-integration'
    runs-on: ubuntu-latest
    env:
      # Turn a silent self-skip into a hard failure: if the persistence-backed tests can't reach a real
      # SQLite database (e.g. sqlite-jdbc missing), they fail instead of passing green. CI must run them for
      # real. Unset everywhere else, so offline/unit builds still self-skip cleanly.
      IMINI_REQUIRE_PERSISTENCE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node.js (so the stdio MCP integration tests run instead of self-skipping)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw
      - name: Check docs reference integrity
        run: bash scripts/check-docs.sh
      - name: Durable-grants real-SQLite integration test
        run: ./mvnw -B -ntp -Dmaven.test.redirectTestOutputToFile=true -Dtest=GrantPersistenceIntegrationTest test
      - name: Persistence round-trips (real SQLite)
        run: ./mvnw -B -ntp -Dmaven.test.redirectTestOutputToFile=true "-Dtest=PersistenceRoundTripTest,MemoryStorePersistenceTest" test
      - name: Assert the integration tests ran against real SQLite (not skipped)
        run: |
          set -e
          for t in GrantPersistenceIntegrationTest PersistenceRoundTripTest MemoryStorePersistenceTest; do
            if ! grep -rq "$t ran against real SQLite" target/surefire-reports/; then
              echo "::error::$t did not run against real SQLite (marker missing — it self-skipped?)"
              exit 1
            fi
          done
          echo "All durable-persistence integration tests ran against real SQLite."
      - name: Golden + eval traces and the full suite
        run: ./mvnw -B -ntp test
