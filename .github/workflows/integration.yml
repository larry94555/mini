name: Integration tests

# OPT-IN integration gate. Unlike ci.yml (which runs the whole suite on every push/PR, where driver-gated
# tests self-skip if a prerequisite is missing), this job provisions the real dependencies (sqlite-jdbc via
# Maven, Node, git) and REQUIRES them: each IMINI_REQUIRE_* switch turns a silent self-skip into a hard
# failure, and a summary step asserts every required dependency was actually exercised. Trigger manually
# (workflow_dispatch) or by adding the "run-integration" label to a PR.
on:
  workflow_dispatch:
  pull_request:
    types: [ labeled ]

permissions:
  contents: read

jobs:
  integration:
    name: Real-dependency integration tests (JDK 21)
    # On PRs, only run when the "run-integration" label is present; always run on manual dispatch.
    if: github.event_name == 'workflow_dispatch' || github.event.label.name == 'run-integration'
    runs-on: ubuntu-latest
    env:
      # Require each provisioned dependency: an unavailable dep becomes a red build instead of a green skip.
      # Unset everywhere else (ci.yml, local/offline), so those builds still self-skip cleanly.
      IMINI_REQUIRE_PERSISTENCE: "1"
      IMINI_REQUIRE_NODE: "1"
      IMINI_REQUIRE_GIT: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Set up Node.js (so the stdio MCP integration tests run instead of self-skipping)
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw
      - name: Check docs reference integrity
        run: bash scripts/check-docs.sh
      - name: Run the full suite (redirect test output so the integration markers are captured)
        run: ./mvnw -B -ntp -Dmaven.test.redirectTestOutputToFile=true test
      - name: Dependency-coverage report (fail if any required dependency was skipped)
        run: bash scripts/integration-coverage.sh
