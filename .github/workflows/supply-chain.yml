name: Supply chain

# Generates a Software Bill of Materials (SBOM) for the built artifact and scans dependencies for known
# vulnerabilities. The scan reports into the Security tab (non-blocking) so a new CVE surfaces without
# wedging unrelated work.
on:
  push:
    branches: [ "main" ]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"   # weekly, Monday 06:00 UTC -- catches newly disclosed CVEs in unchanged deps
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sbom:
    name: SBOM (CycloneDX)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache wrapper Maven distribution
        uses: actions/cache@v6
        with:
          path: .maven
          key: ${{ runner.os }}-mvnwrapper-${{ hashFiles('.mvn/wrapper/maven-wrapper.properties') }}
      - name: Make the Maven wrapper executable
        run: chmod +x mvnw
      - name: Build the jar (so the SBOM reflects resolved dependencies)
        run: ./mvnw -B -ntp -DskipTests package
      - name: Generate SBOM (CycloneDX JSON) with Syft
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: imini-sbom.cdx.json

  scan:
    name: Vulnerability scan (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write   # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v4
      # 1) Report HIGH+CRITICAL into the Security tab (non-blocking, full visibility).
      - name: Trivy scan -> SARIF (report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          format: sarif
          output: trivy-results.sarif
          exit-code: "0"
      - name: Upload results to GitHub code scanning
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      # 2) Gate: on PRs/pushes, FAIL on a fixable CRITICAL (ignore-unfixed avoids blocking on CVEs with no
      #    upstream fix; exceptions go in .trivyignore). The weekly scheduled run does NOT gate -- it only
      #    reports (step 1 above), so newly disclosed HIGH/CRITICAL CVEs surface without breaking main.
      #    Policy: docs/SECURITY.md.
      - name: Trivy gate (fail on fixable CRITICAL -- PRs/pushes only)
        if: github.event_name != 'schedule'
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          trivyignores: .trivyignore
          format: table
          exit-code: "1"
