# Prometheus alerting rules for imini (https://github.com/larry94555/mini).
# Load via prometheus.yml: rule_files: [ "imini-alerts.yml" ]. Metrics come from GET /metrics/prom.
# Adjust thresholds/for-durations to your traffic. All rates use a 5m window.
groups:
  - name: imini-security
    rules:
      - alert: IminiCapabilityDenialsSpiking
        expr: sum(rate(imini_counter{name="audit_capability_denied"}[5m])) > 0.2
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "imini capability denials are spiking"
          description: "More than 0.2 capability_denied/s over 5m for 10m — a caller may be mis-scoped or probing."

      - alert: IminiToolRateLimitingHot
        expr: sum(rate(imini_counter{name="audit_tool_rate_limited"}[5m])) > 0.5
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "imini tool rate-limiting is firing frequently"
          description: "Tenants are being throttled often; consider raising limits or investigating a runaway agent."

      - alert: IminiSpendAlertFiring
        expr: increase(imini_counter{name="audit_spend_alert"}[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "imini spend alert fired"
          description: "A tenant crossed its spend threshold in the last 15m."

  - name: imini-alerting-pipeline
    rules:
      - alert: IminiAlertDeadLettersGrowing
        expr: increase(imini_alerts_dead_lettered[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "imini alerts are being dead-lettered"
          description: "Webhook delivery is failing past retries; check the receiver and POST /admin/alerts/replay after fixing."

      - alert: IminiAlertsDropped
        expr: increase(imini_alerts_dropped[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "imini alert delivery buffer is dropping alerts"
          description: "The in-flight buffer is saturated (alerts.queue-capacity); deliveries are being shed."

      - alert: IminiAlertDeadLetterBacklog
        expr: imini_alerts_dead_letter_size > 0
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "imini dead-letter backlog is non-empty"
          description: "Dead-lettered alerts have been waiting >30m. Inspect GET /admin/alerts/failed and replay."

      - alert: IminiAlertSlaBreaches
        expr: increase(imini_alerts_sla_breaches[15m]) > 0
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "imini escalation ack-SLA breached"
          description: "A dead-letter went un-acked past its tier SLA and was re-escalated. Ack it via POST /admin/alerts/ack?id=... or see /admin/alerts.html."

      - alert: IminiAlertEscalating
        expr: increase(imini_alerts_escalated[15m]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "imini alerts are escalating"
          description: "Un-acked dead-letters are being paged up the escalation ladder. Review /admin/alerts/overview.html."

      - alert: IminiAlertAckLatencyHigh
        expr: max(imini_alerts_ack_latency_max_ms) > 1800000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "imini escalation ack latency is high"
          description: "Escalated alerts are taking >30m to acknowledge. Check on-call responsiveness per tier on the overview page."

      - alert: IminiAlertDeliveryLatencyHigh
        expr: histogram_quantile(0.95, rate(imini_alerts_delivery_latency_ms_bucket[5m])) > 2000
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "imini webhook delivery is slow"
          description: "p95 webhook POST latency has exceeded 2s for 5m; the receiver may be degrading before it starts failing. Try POST /admin/alerts/selftest?send=true."

      # Multi-window error-budget burn (fast page + slow ticket) for the delivery-latency SLO. These reference
      # the app's own good/total counters and target gauge, so the objective lives only in alerts.slo-* config
      # (no hard-coded latency bucket to drift out of sync).
      - alert: IminiAlertDeliverySLOBurnFast
        expr: |
          (1 - (rate(imini_alerts_slo_good_total[5m]) / rate(imini_alerts_slo_total_total[5m]))) > (14.4 * (1 - avg(imini_alerts_slo_target)))
          and
          (1 - (rate(imini_alerts_slo_good_total[1h]) / rate(imini_alerts_slo_total_total[1h]))) > (14.4 * (1 - avg(imini_alerts_slo_target)))
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "imini delivery-latency error budget burning fast"
          description: "Burning >14.4x the error budget over 5m and 1h — at this rate a 30-day budget is gone in ~2 days. See GET /admin/alerts/overview.html."

      - alert: IminiAlertDeliverySLOBurnSlow
        expr: |
          (1 - (rate(imini_alerts_slo_good_total[30m]) / rate(imini_alerts_slo_total_total[30m]))) > (6 * (1 - avg(imini_alerts_slo_target)))
          and
          (1 - (rate(imini_alerts_slo_good_total[6h]) / rate(imini_alerts_slo_total_total[6h]))) > (6 * (1 - avg(imini_alerts_slo_target)))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "imini delivery-latency error budget burning"
          description: "Burning >6x the error budget over 30m and 6h. Investigate the slow route on the overview page before it becomes a page."

      - alert: IminiAlertSLOWindowBudgetExhausted
        expr: imini_alerts_slo_window_budget_remaining < 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "imini rolling-window error budget exhausted"
          description: "The delivery-latency error budget over the rolling window (alerts.slo-window-days) is fully spent — the SLO will be missed for the period. See GET /admin/alerts/overview.html."

      - alert: IminiAlertDeliverySuccessBurnFast
        expr: |
          (1 - (rate(imini_alerts_success_slo_good_total[5m]) / rate(imini_alerts_success_slo_total_total[5m]))) > (14.4 * (1 - avg(imini_alerts_success_slo_target)))
          and
          (1 - (rate(imini_alerts_success_slo_good_total[1h]) / rate(imini_alerts_success_slo_total_total[1h]))) > (14.4 * (1 - avg(imini_alerts_success_slo_target)))
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "imini delivery-success error budget burning fast"
          description: "Alerts are dead-lettering (not landing) faster than the success budget allows. Check receiver health and the dead-letter backlog."

      - alert: IminiAlertSloDigestMuted
        expr: imini_alerts_digest_muted == 1
        for: 1m
        labels:
          severity: info
        annotations:
          summary: "imini SLO digest is muted"
          description: "Scheduled SLO digests are suppressed (mute until {{ $value }}). This is expected during a known-degraded window; it auto-expires and digests resume. Surfaced so a silent digest isn't mistaken for a healthy one."

      - alert: IminiAlertRouteSuccessLow
        expr: imini_alerts_route_success_ratio < avg(imini_alerts_success_slo_target)
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "imini per-route delivery success low ({{ $labels.route }})"
          description: "Route {{ $labels.route }} is delivering below the success target — that receiver is up-but-erroring or repeatedly dead-lettering."

      - alert: IminiAlertRouteSuccessBurning
        expr: |
          (1 - (rate(imini_alerts_route_success_good_total[30m]) / rate(imini_alerts_route_success_total_total[30m]))) > (6 * (1 - avg(imini_alerts_success_slo_target)))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "imini per-route delivery-success budget burning ({{ $labels.route }})"
          description: "Route {{ $labels.route }} is burning >6x its delivery-success error budget over 30m — failing deliveries are concentrated on this receiver even if the global success SLO looks healthy."

      - alert: IminiAlertSLOBudgetExhausted
        expr: imini_alerts_slo_budget_remaining < 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "imini delivery-latency error budget exhausted"
          description: "The observed error budget is fully spent (budget_remaining < 0). The SLO is being missed over the measured window — see GET /admin/alerts/overview.html."

      - alert: IminiAlertRouteSLOBudgetExhausted
        expr: imini_alerts_route_slo_budget_remaining < 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "imini per-route error budget exhausted ({{ $labels.route }})"
          description: "Route {{ $labels.route }} has spent its error budget — a single receiver is missing its (possibly overridden) objective."

      - alert: IminiAlertRouteSLOBurning
        expr: |
          (1 - (rate(imini_alerts_route_slo_good_total[30m]) / rate(imini_alerts_route_slo_total_total[30m]))) > (6 * (1 - avg(imini_alerts_slo_target)))
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "imini per-route delivery SLO burning ({{ $labels.route }})"
          description: "Route {{ $labels.route }} is burning >6x the error budget over 30m — a single receiver is degraded even if the global SLO looks healthy."

      - alert: IminiAlertSelfTestFlapping
        expr: imini_alerts_selftest_flapping == 1
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "imini alert self-test is flapping"
          description: "The synthetic self-test outcome is oscillating — an intermittent delivery problem. Inspect GET /admin/alerts/selftest history."

      - alert: IminiAlertSelfTestFailing
        expr: imini_alerts_selftest_ok == 0
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "imini scheduled alert self-test is failing"
          description: "The synthetic self-test has not passed for 10m — alert delivery may be misconfigured or the receiver is down. Check GET /admin/alerts/config and POST /admin/alerts/selftest?send=true."

      - alert: IminiAlertSuppressionStorm
        expr: increase(imini_alerts_suppressed[15m]) > 100
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "imini dedup is suppressing a storm of alerts"
          description: "A high volume of duplicate alerts is being collapsed. See the top suppressed keys at GET /admin/alerts/digests."

  - name: imini-slo
    rules:
      - alert: IminiRunSuccessRateLow
        expr: imini_run_success_rate < 95
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "imini run success rate below 95%"
          description: "Run success rate has been under 95% for 10m."

      - alert: IminiRunLatencyP95High
        expr: imini_run_latency_p95_ms > 30000
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "imini p95 run latency is high"
          description: "p95 run latency has exceeded 30s for 10m."
