# Port for THIS app's REST API (the agent). llama-server is separate, on 8081.
server.port=8080

# When true, mutating tools (write_file, run_command) run without asking.
# Leave false to see the permission gate in action.
agent.auto-approve=false

# Stream model tokens to the console so you can watch it think in real time.
agent.stream=true

# Context compaction: when estimated tokens cross the threshold, summarize older turns
# and keep this many recent messages verbatim. ctx-size is 8192, so 6000 leaves headroom.
agent.compact-token-threshold=6000
agent.compact-keep-recent=6

# Quieter startup
spring.main.banner-mode=off
logging.level.org.springframework=INFO

# --- Runaway / loop guards ---
# Cap on tokens per single model generation (bounds any one response).
agent.max-tokens=1024
# Overall wall-clock budget for one /ask, across all loop turns and sub-agents.
agent.deadline-seconds=120
# Stream guards (backstops in case the server ignores max-tokens):
agent.stream-max-chars=12000
agent.stream-max-seconds=90

# --- Tier 2: permissions / plan mode ---
# Deny write_file/edit_file targeting paths outside the workspace root (hard boundary).
agent.confine-to-workspace=true
# Workspace root; blank = the directory the app runs in.
agent.workspace-root=

# --- Tier 2: parallel tools & layered context ---
# Run independent read-only tool calls within one turn concurrently.
agent.parallel-tools=true
# Trim a single tool result larger than this (chars) to head+tail before it enters history.
agent.max-tool-result-chars=4000

# --- Tier 3: cheap-model routing for summarization/compaction ---
# Blank = use the main model. Set to a smaller model alias (and base-url) to route summaries to it.
agent.summary-model=
agent.summary-base-url=http://localhost:8081

# --- Model serving & performance (llama-server) ---
# Set manage-server=false to point at an already-running llama-server instead of launching one.
llama.manage-server=true
# Path or name of the llama-server binary (use a full path to pin a specific version).
llama.binary=llama-server.exe
# Profile picks model + context: small = 3B Qwen (default), medium = 7B Qwen, large = 8B Llama-3.1.
llama.profile=small
# Override any profile piece (blank/0/-1 = use the profile default):
llama.hf-model=
llama.model-path=
llama.alias=qwen2.5-3b-instruct
llama.host=0.0.0.0
llama.port=8081
# Host the CLIENT dials to reach llama-server. localhost for a local run; a service name
# (e.g. "llama") when imini runs in a container alongside a llama.cpp container.
llama.client-host=localhost
llama.ctx-size=0
# GPU layers to offload (-ngl). 0 = CPU only; raise it on a GPU build.
llama.gpu-layers=-1
# Worker threads (0 = all CPU cores).
llama.threads=0
# Parallel slots = concurrent requests one server can handle (continuous batching).
llama.parallel=1
# Extra raw flags passed through, e.g. speculative decoding: "--model-draft /path/draft.gguf --draft 16"
llama.extra-args=
# Watchdog: re-check /health and auto-restart a dead server.
llama.auto-restart=true
llama.health-interval-seconds=15
# Prefix / KV-cache reuse (latency). If your llama-server is old and won't start, set cache-reuse=0.
llama.cache-prompt=true
llama.cache-reuse=256
# Speculative decoding (OFF unless a draft model is set). Draft must share the main tokenizer family.
# Flag spelling varies by build; if your server rejects these, use llama.extra-args instead.
llama.draft-hf-model=
llama.draft-model-path=
llama.draft-tokens=16
llama.draft-gpu-layers=-1

# Deadline behavior when a run hits agent.deadline-seconds:
#   ask  = prompt in the console to grant another window (y) or stop (N)
#   stop = hard stop (previous behavior)
agent.deadline-action=ask
# Max agent runs executing at once (0 = use llama.parallel, the model's slot count).
agent.max-concurrent-runs=0

# --- Loop correctness ---
# Force valid tool calls with a GBNF grammar (experimental/opt-in). Off = rely on --jinja + the
# always-on schema validation below. Turn on only for weak models/templates; see README caveat.
llama.constrain-tools=false
# Retry transient model/network failures (IOException / HTTP 5xx) with exponential backoff.
llama.max-retries=2
llama.retry-backoff-ms=400
# Hard timeout for a single shell (run_command) or MCP tool call, in seconds. On timeout the call
# returns an error and the run continues; a wedged MCP server is terminated.
agent.tool-timeout-seconds=60

# --- Sandboxing ---
# run_command screening: off | deny-only (block dangerous patterns, default) | allowlist (only listed)
sandbox.command-mode=deny-only
# allowlist mode: comma-separated allowed first-words or command prefixes (e.g. git status,ls,cat)
sandbox.allow=
# extra denied substrings, merged with the built-in dangerous defaults (comma-separated)
sandbox.deny=
sandbox.max-command-length=2000
# Confine read_file/view/list_dir to the workspace too (writes are confined via permissions already).
sandbox.confine-reads=true
# OPTIONAL container exec for run_command: a prefix ending in an in-container shell that takes the
# command as its next argument; {workdir} -> workspace root. Blank = run on the host. Example:
#   docker run --rm --network none -v {workdir}:/work -w /work alpine sh -c
sandbox.container-command=

# --- Persistence (SQLite) ---
persistence.enabled=true
persistence.db-path=.imini/imini.db

# --- Retrieval / memory (RAG over the workspace) ---
retrieval.chunk-size=1000
retrieval.max-file-kb=200
retrieval.top-k=5
retrieval.extensions=.java,.md,.txt,.json,.xml,.yml,.yaml,.properties,.csv,.html,.js,.ts,.py,.kt,.gradle,.sql,.sh,.bat
# Optional SEMANTIC retrieval via a llama-server embedding endpoint (start a model with --embeddings,
# ideally a SECOND server). Off = fast lexical retrieval with zero setup.
retrieval.embeddings=false
retrieval.embed-base-url=
retrieval.embed-model=nomic-embed-text

# --- Auth + observability ---
# API-key auth. Off by default (open). When on, requests need a valid key in the auth header or
# "Authorization: Bearer <key>". auth.keys is comma-separated "key" or "label:key" (label is shown in
# /metrics attribution). auth.open-paths are always allowed (e.g. health checks).
auth.enabled=false
auth.header=X-API-Key
auth.keys=
auth.open-paths=/health,/,/index.html
# Per-key fixed-window rate limit; 0 = unlimited.
auth.rate-limit-per-minute=0

# --- Remote approvals (ASK mode) ---
# How ASK-mode permission/deadline prompts are answered:
#   console (default) = at the server console (System.in)
#   remote            = parked for the UI/API to answer via GET /approvals + POST /approve
permissions.prompt-mode=console
# How long a parked approval waits before applying the default action (so a run never hangs forever).
permissions.approval-timeout-seconds=120
permissions.approval-timeout-action=deny

# --- Codebase navigation tools ---
# grep skips files larger than this many KB (keeps content search fast).
nav.grep-max-file-kb=512

# --- Agent profile ---
# general (default) keeps the base system prompt; coding adds an explicit codebase workflow that names
# the navigation tools (repo_tree/glob/grep/read_many/git_*) and the orient->locate->read->edit->verify
# loop. Improves coding-task quality on small local models. Captured at session start (like project
# instructions), so set it before starting a /chat session.
agent.profile=general

# --- Logging ---
# All operational logs go through SLF4J/Logback now (levels, timestamps, logger names) instead of
# System.out. Tune verbosity per package; set DEBUG to see chatty lines (tool/todo details).
logging.level.com.example.imini=INFO
# For JSON logs (one object per line), run with the "json" profile instead of editing this file:
#   --spring.profiles.active=json     (or env SPRING_PROFILES_ACTIVE=json)
# See logback-spring.xml. Uses Logback's built-in JsonEncoder (no extra dependency).

# --- Symbol-aware retrieval boost ---
# When a search_memory query term exactly matches a declaration name in a chunk (class/method/function
# /...), add this much to that chunk's score so the file that DEFINES a symbol ranks above files that
# merely mention it. 0 disables. Applies to lexical mode (the default); embeddings mode ranks by cosine.
retrieval.symbol-boost-weight=2.0

# --- Index freshness ---
# After a write_file/edit_file/apply_patch, auto-reindex just that file so search_memory stays current
# (only when the index is non-empty; a write never builds the whole index by itself). index_workspace
# is incremental by default (re-indexes only new/changed/removed files); pass full=true to rebuild.
retrieval.auto-reindex=true

# --- Per-user identity / RBAC ---
# Identity comes from the API key (requires auth.enabled=true). Legacy auth.keys entries are treated as
# admins (backward compatible). Define users with explicit roles here as "user:key:role" (role = admin
# or member), comma-separated. Example:
#   auth.principals=alice:alice-secret:admin,bob:bob-secret:member
auth.principals=
# Endpoints that require the admin role (exact path or subpath). Members get 403 on these.
auth.admin-paths=/metrics,/audit
# Per-resource ownership: sessions are owned by the user who creates them; members see/act on only
# their own sessions, todos, checkpoints, and approvals, while admins see all. Unowned (legacy)
# sessions stay open. No toggle -- it is identity-driven (everyone is admin when auth is disabled).

# --- Plan-driven execution: failure recovery ---
# In plan mode, retry a failed step this many times before giving up on it...
agent.plan.step-retries=1
# ...and, across the whole run, revise the remaining plan after a failure up to this many times.
agent.plan.max-replans=2

# --- Plan-driven execution: step verification ---
# When a plan step's report includes a "CHECK: <shell command>" line, run it (exit 0 = success) to
# verify the step actually worked; the check result overrides the model's self-reported status and
# feeds the same retry/re-plan path. Checks go through the same Sandbox screening as run_command.
agent.plan.verify=true
agent.plan.check-timeout-seconds=20

# --- Plan-driven execution: check suggestions ---
# When a plan step does NOT declare its own "CHECK:" command, suggest one from the project type
# (e.g. "mvn -q -DskipTests compile" for a Maven repo) and the step text, and run it to verify the
# step. Helps weak models that omit checks. Only active when agent.plan.verify=true. The model's own
# CHECK always wins. Disable with agent.plan.suggest-checks=false.
agent.plan.suggest-checks=true

# --- Tool-call-level audit + per-step transcript ---
# Record each mutating tool call (write/edit/patch/run_command/...) to the audit log, attributed to the
# session and (in a plan) the step, and keep a per-step transcript shown at GET /plan. Set false to
# record only request-level audit entries.
agent.audit.tool-calls=true

# --- Edit trust: auto-verify mutations ---
# After a run that changed files, append a git-verified summary (changed files + `git diff --stat`) to
# the final answer, so coding answers state what was actually modified. Read-only git inspection over
# the workspace root; degrades to nothing when the workspace is not a git repo. Disable with false.
agent.verify-edits=true
agent.verify-edits.timeout-seconds=15

# --- Coding report: structured final answer ---
# For runs that changed files, append a structured report (changed files, commands run, verification,
# tests not run, risks). Factual fields come from git + the tool recorder; the soft fields come from a
# small JSON model call. Requires agent.verify-edits-style git access; set false to use the plain
# edit-trust summary instead.
agent.coding-report=true

# --- Plan-driven execution: intermediate diff feedback ---
# After each plan step that changed files, feed a short "[edits this step]" note (files changed + git
# diff --stat so far) into the context for later steps and the final synthesis, so the model can react
# to unexpected diffs mid-plan. Set false to keep step context to the model's own reports only.
agent.plan.step-diff=true
