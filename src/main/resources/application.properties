# Port for THIS app's REST API (the agent). llama-server is separate, on 8081.
server.port=8080

# When true, mutating tools (write_file, run_command) run without asking.
# Leave false to see the permission gate in action.
agent.auto-approve=false

# Stream model tokens to the console so you can watch it think in real time.
agent.stream=true

# Context compaction: when estimated tokens cross the threshold, summarize older turns
# and keep this many recent messages verbatim. ctx-size is 8192, so 6000 leaves headroom.
agent.compact-token-threshold=6000
agent.compact-keep-recent=6

# Quieter startup
spring.main.banner-mode=off
logging.level.org.springframework=INFO

# --- Runaway / loop guards ---
# Cap on tokens per single model generation (bounds any one response).
agent.max-tokens=1024
# Overall wall-clock budget for one /ask, across all loop turns and sub-agents.
agent.deadline-seconds=120
# Stream guards (backstops in case the server ignores max-tokens):
agent.stream-max-chars=12000
# Stream time cap. The default 90s is suitable for GPU-accelerated hardware. On CPU-only systems
# (including WSL without GPU pass-through) generation is much slower -- raise this to give the model
# enough time to finish. 600s (10 min) is safe for CPU-only; lower it once you know your hardware's
# typical generation speed.
agent.stream-max-seconds=600

# --- Tier 2: permissions / plan mode ---
# Deny write_file/edit_file targeting paths outside the workspace root (hard boundary).
agent.confine-to-workspace=true
# Workspace root; blank = the directory the app runs in.
agent.workspace-root=

# Track B: multi-root project work. Default-closed; when false the harness behaves exactly as a single
# READ_WRITE workspace root (the current directory or agent.workspace-root). Additional roots are honored
# only when enabled, and writing into them still requires the usual approval.
agent.multi-root.enabled=false
# Optional static seeds (only when enabled): CSV of path|access, e.g. /srv/in|read, /srv/out|read_write
agent.multi-root.roots=

# --- Tier 2: parallel tools & layered context ---
# Run independent read-only tool calls within one turn concurrently.
agent.parallel-tools=true
# Trim a single tool result larger than this (chars) to head+tail before it enters history.
agent.max-tool-result-chars=4000
# --- RLM-style bounded context fold (chunk -> summarize -> reduce -> recurse) ---
# For a single tool result that VASTLY exceeds the window, head+tail truncation drops the middle. With
# folding enabled, results larger than fold-threshold-chars are instead summarized chunk-by-chunk with the
# cheap summary model (every region is read once; lossy by compression, not deletion). Set fold-enabled
# to false for the prior head+tail-only behavior. See docs/RECURSIVE_LANGUAGE_MODELS.md.
agent.fold-enabled=true
agent.fold-threshold-chars=24000
agent.fold-chunk-chars=8000
agent.fold-target-chars=4000
agent.fold-max-depth=2
# Durable-memory quality guard: if the cross-session memory note grows past this many characters, it is
# consolidated by the summary model (merge duplicates, drop redundancy) before being stored.
agent.memory-max-chars=4000
# Relevance-ranked memory injection: at most this many durable facts are seeded into a new session
# (pinned facts are always included; the rest are the top auto-note facts by relevance to the first message).
agent.memory-inject-max=12
# Default number of facts the recall_memory tool returns when the model doesn't specify k.
agent.memory-recall-k=6
# recall_memory two-stage: shortlist this many candidates with the cheap ranker, then (if memory-rerank)
# have the summary model pick the most relevant. Hygiene ages out facts unused for memory-decay-days.
agent.memory-recall-shortlist=12
agent.memory-rerank=true
agent.memory-decay-days=30

# --- Tier 3: cheap-model routing for summarization/compaction ---
# Blank = use the main model. Set to a smaller model alias (and base-url) to route summaries to it.
agent.summary-model=
agent.summary-base-url=http://127.0.0.1:8081

# --- Model serving & performance (llama-server) ---
# Set manage-server=false to point at an already-running llama-server instead of launching one.
llama.manage-server=true
# Path or name of the llama-server binary (use a full path to pin a specific version).
# Path/name of the llama-server executable. Blank = OS default (llama-server.exe on Windows,
# llama-server on macOS/Linux/WSL). Set an absolute path to pin a specific build.
llama.binary=
# Profile picks model + context: small = 3B Qwen (default), medium = 7B Qwen, large = 8B Llama-3.1.
llama.profile=small
# Override any profile piece (blank/0/-1 = use the profile default):
llama.hf-model=
llama.model-path=
llama.alias=qwen2.5-3b-instruct
llama.host=0.0.0.0
llama.port=8081
# Host the CLIENT dials to reach llama-server. localhost for a local run; a service name
# (e.g. "llama") when imini runs in a container alongside a llama.cpp container.
llama.client-host=127.0.0.1
llama.ctx-size=0
# GPU layers to offload (-ngl). 0 = CPU only; raise it on a GPU build.
llama.gpu-layers=-1
# Worker threads (0 = all CPU cores).
llama.threads=0
# Parallel slots = concurrent requests one server can handle (continuous batching).
llama.parallel=1
# Extra raw flags passed through, e.g. speculative decoding: "--model-draft /path/draft.gguf --draft 16"
llama.extra-args=
# Watchdog: re-check /health and auto-restart a dead server.
llama.auto-restart=true
llama.health-interval-seconds=15
# Prefix / KV-cache reuse (latency). If your llama-server is old and won't start, set cache-reuse=0.
llama.cache-prompt=true
llama.cache-reuse=256
# Speculative decoding (OFF unless a draft model is set). Draft must share the main tokenizer family.
# Flag spelling varies by build; if your server rejects these, use llama.extra-args instead.
llama.draft-hf-model=
llama.draft-model-path=
llama.draft-tokens=16
llama.draft-gpu-layers=-1

# Deadline behavior when a run hits agent.deadline-seconds:
#   ask  = prompt in the console to grant another window (y) or stop (N)
#   stop = hard stop (previous behavior)
agent.deadline-action=ask
# Max agent runs executing at once (0 = use llama.parallel, the model's slot count).
agent.max-concurrent-runs=0

# --- Loop correctness ---
# Force valid tool calls with a GBNF grammar (experimental/opt-in). Off = rely on --jinja + the
# always-on schema validation below. Turn on only for weak models/templates; see README caveat.
llama.constrain-tools=false
# Retry transient model/network failures (IOException / HTTP 5xx) with exponential backoff.
llama.max-retries=2
llama.retry-backoff-ms=400
# Hard timeout for a single shell (run_command) or MCP tool call, in seconds. On timeout the call
# returns an error and the run continues; a wedged MCP server is terminated.
agent.tool-timeout-seconds=60

# --- Sandboxing ---
# run_command screening: off | deny-only (block dangerous patterns, default) | allowlist (only listed)
sandbox.command-mode=deny-only
# allowlist mode: comma-separated allowed first-words or command prefixes (e.g. git status,ls,cat)
sandbox.allow=
# extra denied substrings, merged with the built-in dangerous defaults (comma-separated)
sandbox.deny=
sandbox.max-command-length=2000
# Confine read_file/view/list_dir to the workspace too (writes are confined via permissions already).
sandbox.confine-reads=true
# OPTIONAL container exec for run_command: a prefix ending in an in-container shell that takes the
# command as its next argument; {workdir} -> workspace root. Blank = run on the host. Example:
#   docker run --rm --network none -v {workdir}:/work -w /work alpine sh -c
sandbox.container-command=

# --- Persistence (SQLite) ---
persistence.enabled=true
persistence.db-path=.imini/imini.db

# --- Retrieval / memory (RAG over the workspace) ---
retrieval.chunk-size=1000
retrieval.max-file-kb=200
retrieval.top-k=5
retrieval.extensions=.java,.md,.txt,.json,.xml,.yml,.yaml,.properties,.csv,.html,.js,.ts,.py,.kt,.gradle,.sql,.sh,.bat
# Optional SEMANTIC retrieval via a llama-server embedding endpoint (start a model with --embeddings,
# ideally a SECOND server). Off = fast lexical retrieval with zero setup.
retrieval.embeddings=false
# Max embedding vectors cached in-process (LRU) and rows kept in the embed_cache table.
retrieval.embed-cache-max=4096
retrieval.embed-base-url=
retrieval.embed-model=nomic-embed-text

# --- Auth + observability ---
# API-key auth. Off by default (open). When on, requests need a valid key in the auth header or
# "Authorization: Bearer <key>". auth.keys is comma-separated "key" or "label:key" (label is shown in
# /metrics attribution). auth.open-paths are always allowed (e.g. health checks).
auth.enabled=false
auth.header=X-API-Key
auth.keys=
auth.open-paths=/health,/,/index.html
# Per-key fixed-window rate limit; 0 = unlimited.
auth.rate-limit-per-minute=0

# --- Remote approvals (ASK mode) ---
# How ASK-mode permission/deadline prompts are answered:
#   console (default) = at the server console (System.in)
#   remote            = parked for the UI/API to answer via GET /approvals + POST /approve
permissions.prompt-mode=console
# How long a parked approval waits before applying the default action (so a run never hangs forever).
permissions.approval-timeout-seconds=120
permissions.approval-timeout-action=deny

# --- Codebase navigation tools ---
# grep skips files larger than this many KB (keeps content search fast).
nav.grep-max-file-kb=512

# --- Agent profile ---
# general (default) keeps the base system prompt; coding adds an explicit codebase workflow that names
# the navigation tools (repo_tree/glob/grep/read_many/git_*) and the orient->locate->read->edit->verify
# loop. Improves coding-task quality on small local models. Captured at session start (like project
# instructions), so set it before starting a /chat session.
agent.profile=general

# --- Logging ---
# All operational logs go through SLF4J/Logback now (levels, timestamps, logger names) instead of
# System.out. Tune verbosity per package; set DEBUG to see chatty lines (tool/todo details).
logging.level.com.example.imini=INFO
# For JSON logs (one object per line), run with the "json" profile instead of editing this file:
#   --spring.profiles.active=json     (or env SPRING_PROFILES_ACTIVE=json)
# See logback-spring.xml. Uses Logback's built-in JsonEncoder (no extra dependency).

# --- Symbol-aware retrieval boost ---
# When a search_memory query term exactly matches a declaration name in a chunk (class/method/function
# /...), add this much to that chunk's score so the file that DEFINES a symbol ranks above files that
# merely mention it. 0 disables. Applies to lexical mode (the default); embeddings mode ranks by cosine.
retrieval.symbol-boost-weight=2.0

# --- Index freshness ---
# After a write_file/edit_file/apply_patch, auto-reindex just that file so search_memory stays current
# (only when the index is non-empty; a write never builds the whole index by itself). index_workspace
# is incremental by default (re-indexes only new/changed/removed files); pass full=true to rebuild.
retrieval.auto-reindex=true

# --- Per-user identity / RBAC ---
# Identity comes from the API key (requires auth.enabled=true). Legacy auth.keys entries are treated as
# admins (backward compatible). Define users with explicit roles here as "user:key:role" (role = admin
# or member), comma-separated. Example:
#   auth.principals=alice:alice-secret:admin,bob:bob-secret:member
auth.principals=
# Endpoints that require the admin role (exact path or subpath). Members get 403 on these.
auth.admin-paths=/metrics,/audit
# Per-resource ownership: sessions are owned by the user who creates them; members see/act on only
# their own sessions, todos, checkpoints, and approvals, while admins see all. Unowned (legacy)
# sessions stay open. No toggle -- it is identity-driven (everyone is admin when auth is disabled).

# --- Plan-driven execution: failure recovery ---
# In plan mode, retry a failed step this many times before giving up on it...
agent.plan.step-retries=1
# ...and, across the whole run, revise the remaining plan after a failure up to this many times.
agent.plan.max-replans=2

# --- Plan-driven execution: step verification ---
# When a plan step's report includes a "CHECK: <shell command>" line, run it (exit 0 = success) to
# verify the step actually worked; the check result overrides the model's self-reported status and
# feeds the same retry/re-plan path. Checks go through the same Sandbox screening as run_command.
agent.plan.verify=true
agent.plan.check-timeout-seconds=20

# --- Plan-driven execution: check suggestions ---
# When a plan step does NOT declare its own "CHECK:" command, suggest one from the project type
# (e.g. "mvn -q -DskipTests compile" for a Maven repo) and the step text, and run it to verify the
# step. Helps weak models that omit checks. Only active when agent.plan.verify=true. The model's own
# CHECK always wins. Disable with agent.plan.suggest-checks=false.
agent.plan.suggest-checks=true

# --- Tool-call-level audit + per-step transcript ---
# Record each mutating tool call (write/edit/patch/run_command/...) to the audit log, attributed to the
# session and (in a plan) the step, and keep a per-step transcript shown at GET /plan. Set false to
# record only request-level audit entries.
agent.audit.tool-calls=true

# --- Edit trust: auto-verify mutations ---
# After a run that changed files, append a git-verified summary (changed files + `git diff --stat`) to
# the final answer, so coding answers state what was actually modified. Read-only git inspection over
# the workspace root; degrades to nothing when the workspace is not a git repo. Disable with false.
# Edit verification and coding report. These add a git-diff summary and structured coding report
# to every response -- useful when using imini as a coding agent (agent.profile=coding), but
# distracting for general conversation. Set both to false for a clean conversational experience.
# Switch to true if you are using imini to write/edit code in your workspace.
agent.verify-edits=false
agent.verify-edits.timeout-seconds=15

# Allow the git_push tool to push to a remote. OFF by default because pushing affects shared remote
# state; even when true, git_push is still mutating (approval-gated) and subject to capability scoping.
git.allow-push=false

# --- Coding report: structured final answer ---
# For runs that changed files, append a structured report (changed files, commands run, verification,
# tests not run, risks). Factual fields come from git + the tool recorder; the soft fields come from a
# small JSON model call. Requires agent.verify-edits-style git access; set false to use the plain
# edit-trust summary instead. Disabled by default -- turn on when using imini as a coding agent.
agent.coding-report=false

# --- Plan-driven execution: intermediate diff feedback ---
# After each plan step that changed files, feed a short "[edits this step]" note (files changed + a git
# diff --stat) into the context for later steps and the final synthesis, so the model can react to
# unexpected diffs mid-plan. Set false to keep step context to the model's own reports only.
agent.plan.step-diff=true
# Compute each step's EXACT delta by snapshotting the working tree (a throwaway git index) before and
# after the step and diffing the two snapshots -- this attributes re-edits to the right step and reports
# a per-step (not cumulative) diff stat. Set false to fall back to "newly-touched paths + cumulative
# stat" (no snapshot). Requires a git workspace; degrades to the fallback when unavailable.
agent.plan.step-diff.snapshot=true

# --- Plan history ---
# Keep the last N completed plans per session (goal + final checklist + tool transcript + coding
# report), inspectable at GET /plans and GET /plan?n=<seq>. Set 0 to keep unlimited.
agent.plan.history-max=20

# --- Coding report: schema enforcement ---
# When the structured coding report is incomplete for a run that changed files (e.g. no verification
# reported, no risks, or no summary), append a "[!] Report gaps: ..." line flagging the gaps (also
# logged and archived in plan history). Descriptive, not a hard gate. Only relevant when
# agent.coding-report=true.
agent.coding-report.enforce=false

# --- Skills (reusable instruction bundles) ---
# Discover SKILL.md files under <root>/<skills.dir>; inject a short index into the system prompt and
# expose load_skill (load one on demand) and save_skill (capture knowledge). auto-load injects the
# best-matching skill body for /ask queries (a hedge for weaker models). max-body caps an injected body.
skills.enabled=true
skills.dir=skills
skills.auto-load=false
skills.max-body=4000
# Remote skill repositories (Phase 3): a comma-separated ALLOWLIST of git URLs cloned read-only into
# <root>/<skills.cache-dir>. Only URLs listed here are ever fetched (the model cannot inject one). Local
# skills override remote ones of the same name. refresh_skills (tool) re-pulls. Skills remain
# instructions only -- no bundled scripts are executed. Pin a repo to a branch or tag with url#ref, e.g.
# https://github.com/org/skills.git#v1.2
skills.repos=
skills.cache-dir=skill-cache
skills.repo-timeout-seconds=60
skills.repos-on-start=true
# Skill registry (provenance): path (under root) to a manifest JSON listing available skills as
# [{name, description, source, version, sha256}]. search_skills ranks it; install_skill fetches a skill
# from its source (relative to the manifest's directory), VERIFIES the sha256, and saves it locally.
skills.registry=
# Comma-separated skill names to start DISABLED (excluded from the index/auto-load/load_skill until
# re-enabled via POST /skills/toggle by an admin or the Skills card in the UI).
skills.disabled=

# Project memory (CLAUDE.md-style, layered). Files are loaded in order (.claude/CLAUDE.md, CLAUDE.md,
# IMINI.md, AGENTS.md, .claude/rules/*.md, then CLAUDE.local.md) and concatenated into the system
# prompt; a file may inline another with an @path line. /memory (and GET /memory/files) show what
# loaded. import-max-depth caps @-import recursion; max-file-kb skips oversized memory files.
memory.import-max-depth=3
memory.max-file-kb=64

# /init repository scan (drafts CLAUDE.md). Caps how many files the scan walks for language
# detection; build/vcs dirs (.git, target, node_modules, ...) are always skipped.
init.scan-max-files=5000

# @file / @directory prompt references. When a user message mentions @path, the file's content
# (or a directory's listing) is inlined into what the model sees. Resolution is confined to the
# workspace and capped; unresolved tokens (e.g. @mentions) are left untouched.
context.refs.enabled=true
context.refs.max-files=10
context.refs.max-file-kb=64
# A referenced @file over max-file-kb is skipped by default; with folding on, files up to
# max-fold-file-kb are read and folded (gist kept) instead of skipped. See docs/RECURSIVE_LANGUAGE_MODELS.md
context.refs.fold-large-files=true
context.refs.max-fold-file-kb=512
context.refs.max-total-kb=256
context.refs.max-dir-entries=100

# Custom subagents: named, tool-scoped helpers the main agent can delegate to (each runs in its
# own isolated loop and returns only its final answer). Ships with read-only built-ins (explore,
# review, debug, research); agents/<name>.md adds or overrides them. /agents lists, /agent <name>
# <task> delegates, and the model can call the delegate_agent tool.
agents.enabled=true
agents.dir=agents

# Token budget for a single llama-server call (prompt + reserved response). If a prompt would
# exceed the server's context window the request 400s; the harness enforces this budget before
# sending, trimming/condensing the message list to fit (see TokenBudget/ContextManager). The
# enforced PROMPT cap is this budget minus agent.max-tokens, additionally clamped to the server's
# detected n_ctx. Settable at runtime in the web UI or via POST /settings/token-budget.
agent.max-prompt-tokens=8500

# Auto plan-mode fallback: when a single normal turn's prompt would exceed the enforced token cap,
# answer it via plan mode (decompose into steps, each sent within the budget) instead of trimming
# context to force a one-shot answer. Set false to always run normally (the budget enforcer still
# trims to fit).
agent.plan.auto-fallback=true

# /loop — bounded iterate-until-green. max-attempts is the default attempt budget; hard-max-attempts
# caps what a user can request via attempts=N.
agent.loop.max-attempts=5
agent.loop.hard-max-attempts=20

# Local scheduled tasks: run a prompt after a delay or on an interval, unattended (AUTO mode).
# In-memory and single-node (tasks do not survive a restart). max-tasks bounds the count;
# tick-seconds is how often the scheduler checks for due tasks.
agent.schedule.enabled=true
agent.schedule.max-tasks=50
agent.schedule.tick-seconds=5

# Image (multimodal) input. When true (or when llama-server reports a vision capability via
# /props), an image attached to a one-shot ask is sent to the model in the OpenAI image_url
# format. On a text-only model the image is dropped with a note. Most local llama.cpp builds are
# text-only, so this defaults to false; set true when running a vision GGUF (with --mmproj).
model.vision-enabled=false

# Optional default plugin registry index (a JSON document listing installable packs). When set,
# GET /plugin/registry and the web UI's Plugins card can browse it without a URL each time;
# leave blank to require an explicit url= on each call.
plugins.registry-url=

# Durable run history: how many recent runs to keep in the run_history table (older rows are
# pruned). The admin dashboard reloads a tail of these on startup so recent runs survive a restart.
agent.run-history.persist-max=500

# Optional shared secret for signing/verifying workspace bundles (HMAC-SHA256). When set, exported
# bundles are signed and imports verify the signature (a tampered or unsigned-but-expected bundle
# is reported; an invalid signature is refused). Blank = signing disabled. This is shared-secret
# signing (provenance among holders of the secret), not public-key signing.
bundle.signing-secret=

# Public-key (Ed25519) bundle signing, preferred over the shared secret when set. The signer sets the
# base64 private key; verifiers set only the base64 public key (true third-party provenance --
# verifiers cannot forge signatures). Mint a pair with POST /workspace/keygen. Blank = disabled.
bundle.signing-private-key=
bundle.signing-public-key=

# Verifier keyring: trust several publisher public keys. Comma- or newline-separated entries, each
# 'keyId:base64PublicKey' or a bare 'base64PublicKey' (key id derived). The legacy single
# bundle.signing-public-key is also trusted. A bundle/pack may name the signer's keyId to pick
# the right key fast; verification falls back to trying every trusted key.
bundle.verify-public-keys=
# Optional explicit key id for THIS signer (else derived from bundle.signing-public-key).
bundle.signing-key-id=
# Revoked key ids (comma/newline-separated): a signature matching one of these keys is rejected even
# though the key is in the verify ring -- use to retire a compromised key without removing the entry.
bundle.revoked-key-ids=

# When true, installing a plugin pack (including by URL/registry) requires a signature that
# verifies against the configured keyring/secret; unsigned or invalid packs are refused.
plugins.require-signature=false

# Circuit breaker for llama-server calls: open after this many consecutive transient failures,
# then fail fast for cooldown-ms before probing again.
llama.circuit-breaker-threshold=5
llama.circuit-breaker-cooldown-ms=30000

# Maximum bytes captured from a sandbox command process (excess is truncated).
sandbox.max-output-bytes=65536

# Seconds to wait for in-flight runs to finish before forcing shutdown.
agent.shutdown-drain-seconds=30

# Session expiry: prune sessions idle longer than this many hours (0 = disabled). The reaper runs
# every session-reap-interval-minutes.
agent.session-ttl-hours=0
agent.session-reap-interval-minutes=60

# Persist rate-limit windows in SQLite so limits survive a restart (requires persistence).
auth.rate-limit-persistent=true
# Rate-limit algorithm: "fixed" (simple fixed window) or "sliding" (sliding-window counter that smooths
# out the burst-at-window-boundary weakness of the fixed window). Both respect rate-limit-per-minute.
auth.rate-limit-algorithm=fixed
# How often (minutes) to prune stale rate-limit windows for keys that have gone quiet, so the rate_limits
# table can't grow without bound. 0 disables the pruner. Only active when rate-limit-per-minute > 0.
auth.rate-limit-reap-interval-minutes=10

# --- Distributed tracing (OpenTelemetry-compatible, dependency-free) ---
# Emit spans (W3C trace/span ids) for runs; view recent spans at GET /admin/traces. Off by default
# (zero overhead). When on, spans are kept in a bounded in-memory ring and (if tracing.persist) the
# trace_spans table.
tracing.enabled=false
tracing.persist=true
tracing.ring-size=512
# Cross-service export + propagation. If tracing.otlp-endpoint is set (e.g. http://localhost:4318/v1/traces),
# each finished span is POSTed there as OTLP/JSON (best-effort, off the request thread). Blank = no export.
# Inbound W3C traceparent headers are always honored when tracing is on, so a caller's trace continues here.
tracing.otlp-endpoint=
tracing.service-name=imini

# --- Per-tenant cost accounting + quotas ---
# Record per-tenant token usage to the cost_ledger and derive cost from per-million-token prices.
# View per-tenant usage at GET /admin/cost. Set prices to your model/provider's rates (0 = free/local).
cost.enabled=true
cost.input-usd-per-million=0
cost.output-usd-per-million=0
# Soft monthly token quota per tenant; a tenant over quota gets HTTP 429 on every run endpoint
# (/ask, /chat, /ask/stream, /chat/stream). 0 = unlimited. This is the DEFAULT tier.
cost.monthly-token-quota=0
# Named quota tiers and per-tenant assignment. Tiers: "free=100000,pro=5000000" (monthly token quotas,
# 0=unlimited). Assignments: "alice=pro,bob=free". A tenant with no assignment uses the default quota above.
cost.tiers=
cost.tier-assignments=

# --- Eval harness ---
# Enable the agent-evaluation suite (POST /admin/eval). Self-skips when the model is unreachable.
eval.enabled=true

# --- Tool capability scoping ---
# Restrict WHICH tools a caller may invoke, by role, on top of PermissionService's mode gating. Off by
# default (every tool permitted). When enabled, configure per-role tool allowlists; "*" means all tools.
# The admin role is always unrestricted; background/sub-agent runs are unrestricted (system identity).
capabilities.enabled=false
# Per-role scopes: "role=tool1|tool2, role2=*". Roles come from auth.principals.
capabilities.scopes=
# Scope for roles with no explicit entry above ("*" = unrestricted).
capabilities.default-scope=*

# --- Secret / PII redaction ---
# Mask secret- and PII-shaped values (bearer tokens, key=value secrets, sk-/AWS/JWT tokens, emails) in
# trace span attributes. On by default. Console log redaction is always applied via the %rmsg converter in
# logback-spring.xml (switch it back to %msg there to disable).
redaction.enabled=true

# Operator-supplied extra redaction patterns, applied after the built-ins so a deployment can mask its own
# secret/PII shapes without code changes. Entries are separated by ;; and each is a regex optionally followed
# by =>replacement (default replacement is ****). Invalid regexes are skipped at startup. Example:
#   redaction.patterns=EMP-\\d{6}=>EMP-****;;(?i)\\bpassword\\b\\s*\\S+=>password ****
redaction.patterns=

# --- Per-tool rate limiting ---
# Cap how often an expensive tool may run per tenant within a sliding window, complementing capability
# scoping (may you use it?) with throughput limits (how often?). Comma-separated tool=limit/windowSeconds
# entries; a tool with no entry is unlimited. Keyed per tenant. Off by default. Example:
#   tool-rate-limit.limits=web_fetch=10/60, run_command=5/60
tool-rate-limit.enabled=false
tool-rate-limit.limits=
# Persist per-tool window state in the shared rate_limits SQLite table (under tool:-prefixed keys) so limits
# survive a restart and are shared across instances on the same database. Requires persistence; falls back to
# in-memory state when off or no database. Default on.
tool-rate-limit.persistent=true

# --- Alert notification sink ---
# Forward selected audit events (security-relevant by default) to an external channel so they can page an
# operator, not just sit in the audit log. When enabled, each matching event is logged at WARN and, if a
# webhook URL is set, POSTed there as JSON on a background thread (best-effort; never blocks a run).
alerts.enabled=false
# Comma-separated audit actions to forward. Defaults to the three security actions.
alerts.actions=capability_denied,spend_alert,tool_rate_limited
# Optional HTTP endpoint to POST alert JSON to (e.g. a Slack/PagerDuty-compatible webhook). Empty = log only.
alerts.webhook-url=
# Delivery buffer: failed webhook POSTs are retried with exponential backoff (base ms doubling per attempt,
# capped at 60s), then moved to a bounded in-memory dead-letter ring inspectable at /admin/alerts/failed.
# queue-capacity bounds in-flight deliveries (newest dropped when full). Tune for your webhook's reliability.
alerts.max-retries=3
alerts.retry-backoff-ms=500
alerts.queue-capacity=1000
alerts.dead-letter-capacity=100
# Persist dead-lettered alerts in SQLite (alerts_dead_letter table) so they survive a restart and can be
# replayed via POST /admin/alerts/replay. Falls back to the in-memory ring when off or no database. Default on.
alerts.dead-letter-persistent=true
# Optional payload template. When set, the webhook body is this string with {ts} {time} {user} {action}
# {target} {outcome} substituted (string fields JSON-escaped) — shape it for Slack/PagerDuty/etc. Empty uses
# the built-in JSON object. Example (Slack):
#   alerts.template={"text":"[imini] {action} by {user} on {target}: {outcome}"}
alerts.template=
# Per-action routing: send specific actions to their own webhook (and optionally template). Routes are
# separated by ;; and each is action|url|template (template optional, may contain anything but ;;). Actions
# without a route fall back to alerts.webhook-url / alerts.template. Example:
#   alerts.routes=spend_alert|https://finance.example/hook;;capability_denied|https://sec.example/hook|{"text":"DENIED {target}"}
# Each route may add optional per-route SLO overrides as a 4th/5th field: action|url|template|latency|target
# (e.g. spend_alert|https://hook||500|0.999 gives that route a 500ms/99.9% objective). Omitted/blank fields
# inherit the global alerts.slo-latency-ms / alerts.slo-target. A 6th field overrides the delivery-success
# target for that route: action|url|template|latency|target|success-target (e.g. ...||0|0|0.95).
alerts.routes=
# Dead-letter retention: a background reaper ages out failed dead-letters older than this many hours (0 =
# keep forever). Only applies to the durable SQLite store; the in-memory ring is already size-bounded.
alerts.dead-letter-retention-hours=168
alerts.dead-letter-reap-interval-minutes=60
# Dedup/throttling: collapse repeated identical alerts (same action+target) within this many seconds into one
# notification (the next forwarded alert after the window notes how many were suppressed). 0 disables dedup.
alerts.dedup-window-seconds=0
# Share dedup windows across instances via the alert_dedup SQLite table (cluster-wide throttling) instead of
# per-process state. Falls back to in-memory when off or no database. Default on (only matters when dedup > 0).
alerts.dedup-shared=true
# Escalation / re-page on unacked: if a dead-letter stays failed and un-acked longer than this many minutes,
# re-page it once to alerts.escalate-url (0 = disabled). Acknowledge with POST /admin/alerts/ack?id=... The
# escalation sweep runs on the dead-letter reaper tick, so its granularity is the reap interval.
alerts.escalate-after-minutes=0
alerts.escalate-url=
# Escalation ladder (preferred over the single-tier keys above): an ordered list of tiers separated by ;;
# each tier is delay|url|template (template optional). delay accepts 30s/15m/2h/1d or bare ms. A dead-letter is
# paged to the next tier once its age crosses that tier's delay; the advance is an atomic claim so concurrent
# reapers page each tier once. If empty, the single-tier escalate-after-minutes/escalate-url above are used.
#   alerts.escalate-tiers=15m|https://oncall.example/primary;;1h|https://oncall.example/secondary
# Each tier may carry an optional 4th field, an ack-SLA deadline (delay|url|template|sla): if a dead-letter
# sits at that tier longer than the SLA without being acked, it is re-escalated to the next tier (or re-paged
# at the top tier). Example: 15m|https://primary||30m;;1h|https://secondary||2h (empty template, 30m/2h SLA).
alerts.escalate-tiers=
# Dedup digests: when a dedup window elapses with suppressed duplicates, emit one digest notification
# summarizing the count (routed to that action's webhook) so a suppressed storm stays visible. Default on
# (only matters when alerts.dedup-window-seconds > 0).
alerts.dedup-digest=true
# Delivery-latency SLO: the objective is that at least slo-target of webhook deliveries complete within
# slo-latency-ms. The observed success ratio and error-budget burn rate are exposed in stats and Prometheus
# (imini_alerts_slo_*), and the ops bundle ships multi-window burn-rate alert rules.
alerts.slo-latency-ms=1000
alerts.slo-target=0.99
# Rolling-window SLO: budget_remaining over the last N days (not just cumulative-since-boot), exposed as
# imini_alerts_slo_window_* — this is the "how much runway is left this month" number.
alerts.slo-window-days=30
# Delivery-success SLO: the objective that at least success-target of finalized deliveries actually land (2xx)
# rather than dead-letter. Distinct from the latency SLO (a route can be fast but returning 5xx). Exposed as
# imini_alerts_success_slo_* and per route as imini_alerts_route_success_ratio.
alerts.success-target=0.99
# Hot-reload persistence: when set, POST /admin/alerts/reload writes the reloaded config to this file and it is
# re-applied at startup, so a live fix survives a restart. Blank = in-memory only (reload still works, but is
# lost on restart). The file is a standard .properties file with alerts.* keys.
alerts.config-override-file=
# Scheduled self-test: every selftest-interval-minutes (0 = off), push a synthetic alert through the pipeline
# and record the result (imini_alerts_selftest_ok). By default it only checks resolution (does the action route
# to a configured URL?); set selftest-send=true to also fire a live probe POST each tick — point
# selftest-action at a route wired to a health endpoint so you don't page a real channel. Blank action uses a
# sample action.
alerts.selftest-interval-minutes=0
alerts.selftest-action=
alerts.selftest-send=false
# Self-test flap detection: the scheduled self-test keeps a short history; if its pass/fail outcome oscillates
# at least this many times across that history it is reported as "flapping" (imini_alerts_selftest_flapping).
# 0 disables flap detection.
alerts.selftest-flap-threshold=3
# Scheduled SLO digest: every slo-digest-interval-minutes (0 = off), POST a posture summary (rolling-window
# budget remaining, delivery-success ratio, worst route) to slo-digest-url (falling back to alerts.webhook-url),
# so the SLO posture reaches people who don't open the dashboard. A periodic summary, sent synchronously
# without retry.
alerts.slo-digest-interval-minutes=0
alerts.slo-digest-url=
# Optional digest message template. Blank = the built-in one-liner. Placeholders: {window_ratio}
# {window_budget} {window_days} {delivery_success} {slo_target} {success_target} {worst_route}
# {worst_route_ratio} {worst_success_route} {worst_success_route_ratio} {budget_delta}
# {delivery_success_delta} {dead_lettered_delta} {since_last_minutes} (delta fields show n/a on the first
# digest). Send a digest on demand with POST /admin/alerts/slo-digest (CSRF-guarded).
alerts.slo-digest-template=
# Route the SLO digest through the normal delivery pipeline (retry + dead-letter) instead of a one-shot POST.
# Default false (synchronous probe). Set true to make digest delivery reliable at the cost of treating a
# periodic summary like a regular alert (it can be retried/dead-lettered/escalated).
alerts.slo-digest-via-pipeline=false
# Include the machine-readable snapshot object in the digest webhook payload alongside the text field
# (true, default). Set false for receivers that only want {"text":"..."} and choke on extra fields.
alerts.slo-digest-structured=true
# Cap on retained SLO digest history rows in alert_meta (oldest beyond this are pruned on each post). The
# digest history is viewable at GET /admin/alerts/slo-digest/history and on the overview page. Scheduled
# digests can be muted for a period via POST /admin/alerts/slo-digest/mute?hours=N (and /unmute).
alerts.slo-digest-history-max=50
# Cap on how long a single mute can silence digests (hours). A mute request above this is clamped; 0 or
# negative means no cap. Guards against a fat-fingered mute silencing digests for far too long.
alerts.slo-digest-mute-max-hours=72
# A reason becomes mandatory when a mute request exceeds this many hours (0 or negative disables the
# requirement). Long silences should be explained; the mute is rejected (HTTP 400) if no reason is given.
alerts.slo-digest-reason-required-hours=8
# CSRF guard for the admin dead-letter viewer's state-changing actions (replay/ack/delete/bulk/escalate).
# The viewer embeds a per-process token and sends it back as the X-CSRF-Token header; mutating endpoints
# reject requests without it. Scripts can fetch the token from GET /admin/alerts/csrf (or pass ?csrf=).
# Set false for purely API/scripted deployments that don't use the browser viewer.
alerts.admin-csrf=true
# CSRF tokens are signed (HMAC-SHA256) and carry a TTL, so they validate statelessly. Set a shared secret
# (the SAME value on every node) so tokens verify across instances behind a load balancer; left blank, a
# random per-process secret is used (single-instance only). TTL controls how long an embedded token stays
# valid before the viewer must re-fetch one.
alerts.csrf-secret=
alerts.csrf-ttl-seconds=3600

# --- Spend alerts ---
# Warn once per tenant per month when monthly tokens cross a threshold. The threshold is the lower of an
# absolute token count and a percentage of the tenant's quota; 0 disables each trigger.
cost.alert-token-threshold=0
cost.alert-percent=0
