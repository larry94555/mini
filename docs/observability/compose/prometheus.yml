# Prometheus config for the docker-compose observability overlay (service names, not localhost).
global:
  scrape_interval: 15s

rule_files:
  - /etc/prometheus/alert-rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: imini
    metrics_path: /metrics/prom
    scheme: http
    # If you enable auth in imini, add a Bearer token here:
    # authorization: { type: Bearer, credentials: <admin-api-key> }
    static_configs:
      - targets: ["imini:8080"]
